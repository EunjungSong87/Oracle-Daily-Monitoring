services:
  oracle-test:
    # Pinned below latest: newer "Oracle AI Database" banner breaks Debezium's
    # version-detection query (LIKE 'Oracle Database%'), used by ../Datalake's CDC connector.
    image: gvenzl/oracle-free:23.4
    container_name: oracle-daily-monitoring-test
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-OraTest_2026!}
    ports:
      - "1521:1521"
    volumes:
      - oracle_test_data:/opt/oracle/oradata
      - ./docker/initdb:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  oracle_test_data:

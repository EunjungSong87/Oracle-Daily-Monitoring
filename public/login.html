<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DB Cockpit — 로그인</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="common.js"></script>
</head>
<body>
    <div class="login-page">
        <div class="login-brand">
            <span class="brand-mark"><svg class="brand-icon" viewBox="0 0 32 32" aria-hidden="true"><ellipse cx="16" cy="11" rx="8.5" ry="3.2" fill="#fff"/><path d="M8 11v11.5c0 1.8 3.6 3.2 8 3.2s8-1.4 8-3.2V11" stroke="#fff" stroke-width="2.3" opacity="0.6" fill="none"/><path d="M7 19.6h4.6l1.8-3.6 2.3 6 1.8-2.4h5.7" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></span>
            <span class="login-brand-name">DB Cockpit</span>
        </div>

        <form id="login-form" onsubmit="submitLogin(event)">
            <label for="username">아이디</label>
            <input type="text" id="username" name="username" required autofocus autocomplete="username">

            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">

            <button type="submit" id="login-submit-btn">로그인</button>
        </form>
    </div>

    <script>
        function getNextUrl() {
            const params = new URLSearchParams(window.location.search);
            const next = params.get('next');
            return next && next.startsWith('/') ? next : 'index.html';
        }

        async function submitLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            if (!username || !password) {
                showToast('아이디와 비밀번호를 입력해주세요.', 'error');
                return;
            }

            const button = document.getElementById('login-submit-btn');
            button.disabled = true;
            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });
                if (!response.ok) {
                    const err = await response.json().catch(() => ({}));
                    showToast(err.message || '로그인 실패', 'error');
                    button.disabled = false;
                    return;
                }
                window.location.href = getNextUrl();
            } catch (error) {
                console.error('로그인 실패:', error);
                showToast('로그인 중 오류가 발생했습니다.', 'error');
                button.disabled = false;
            }
        }
    </script>
</body>
</html>

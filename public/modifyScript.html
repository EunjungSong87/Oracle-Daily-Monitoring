<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="common.js"></script>
    <title>Modify Script</title>
</head>
<body>

<a href="monitoringScript.html">
<h1>Modify Script</h1>

<nav>
    <ul>
        <li><a href="index.html">DBMS List</a></li>

        <li><a href="monitoringScript.html">Monitoring Scripts</a></li>

<!-- Script 수정 폼입니다. -->
<form id="modify-dbms" onsubmit="event.preventDefault()">
    <label for="ID">ID:</label>
    <input type="number" id="ID" name="ID" required><br>

    <label for="NAME">NAME:</label>
    <input type="text" id="NAME" name="NAME" required><br>

    <label for="CATEGORY">CATEGORY:</label>
    <input type="text" id="CATEGORY" name="CATEGORY" required><br>

    <label for="DESCRIPTION">DESCRIPTION:</label>
    <input type="text" id="DESCRIPTION" name="DESCRIPTION" required><br>

    <label for="SID">SQL_TEXT:</label>
    <textarea type="text" id="SQL_TEXT" name="SQL_TEXT" required></textarea><br>

    <label for="SCHEDULE">SCHEDULE:</label>
    <input type="text" id="SCHEDULE" name="SCHEDULE" required><br>

    <label for="IS_ACTIVE">IS_ACTIVE:</label>
    <input type="text" id="IS_ACTIVE" name="IS_ACTIVE" required><br>

    <!-- 게시글 작성 버튼 -->
    <button type="button" onclick="modifyScript()">수정 완료</button>

    <!-- 뒤로가기 버튼 -->
    <button type="button" class="btn-secondary" onclick="goBack()">뒤로 가기</button>
</form>

<!-- 게시글 작성 스크립트 파일을 로드합니다. -->
<script>

    // 기존의 값 가져와 서 세팅 하기
     window.onload = async function () {
        const data = JSON.parse(localStorage.getItem("editData"));
        console.log ( data ) ;
        const scriptConfig = { id : data.id , name : data.name };
        console.log ( scriptConfig ) ;
        const sqlText = await getSqlText(scriptConfig);

        document.getElementById('ID').value = data.id;
        document.getElementById('NAME').value = data.name;
        document.getElementById('CATEGORY').value = data.category;
        document.getElementById('DESCRIPTION').value = data.description;
        document.getElementById('SQL_TEXT').value = sqlText;
        document.getElementById('SCHEDULE').value = data.schedule;
        document.getElementById('IS_ACTIVE').value = data.is_active;

    };

    async function getSqlText(scriptConfig) {

        try {
            const response =  await fetch('/api/getSqlText', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(scriptConfig)
            });

            if (response.ok) {
                const result = await response.json();
                const sqlText = Object.values(result);
                console.log( '화면', sqlText[1] );
                return sqlText[1] ;
            } else {
                showToast(`요청 실패: ${response.status}`, 'error');
            }
        } catch (error) {
            console.error('Error:', error.message);
            showToast('요청 처리 중 오류가 발생했습니다.', 'error');
        }
    }

    async function modifyScript() {

        console.log( 'modifyScript');
        const data = JSON.parse(localStorage.getItem("editData"));

        const id          =  document.getElementById('ID');
        const name        =  document.getElementById('NAME');
        const category    =  document.getElementById('CATEGORY');
        const description =  document.getElementById('DESCRIPTION');
        const sql_text    =  document.getElementById('SQL_TEXT');
        const schedule    =  document.getElementById('SCHEDULE');
        const is_active   =  document.getElementById('IS_ACTIVE');

        if (!id.value || !name.value || !sql_text.value || !is_active.value ) {
            showToast('필수 항목을 입력해주세요.', 'error');
            return;
        }

        const scriptConfig = {
            id          : id.value,
            name        : name.value,
            category    : category.value,
            description : description.value,
            sql_text    : sql_text.value,
            schedule    : schedule.value,
            is_active   : is_active.value
        };

        try {
            const response = await fetch('/api/modifyScript', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(scriptConfig)
            });

            if (response.ok) {
                setFlashMessage('Script 수정 완료.');
                window.location.href = 'monitoringScript.html'
            } else {
                showToast(`요청 실패: ${response.status}`, 'error');
            }
        } catch (error) {
            console.error('Error:', error.message);
            showToast('요청 처리 중 오류가 발생했습니다.', 'error');
        }
    }

    function goBack() {
        window.history.back();
    }
</script>
</body>
</html>

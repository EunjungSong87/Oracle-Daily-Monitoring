<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issues</title>

    <link rel="stylesheet" href="style.css">
    <script src="common.js"></script>
</head>
<body>
    <a href="index.html">
    <h1>Issues</h1>
    </a>

    <nav>
        <ul>
            <li><a href="index.html">DBMS List</a></li>
            <li><a href="dailyMonitoring.html">Daily Monitoring</a></li>
            <li><a href="monitoringScript.html">Monitoring Scripts</a></li>
            <li><a href="monitoringThresholds.html">Thresholds</a></li>
            <li><a href="tableSpec.html">Table Spec</a></li>
            <li><a href="history.html">Run History</a></li>
            <li><a href="issues.html" class="current">Issues</a></li>
        </ul>
    </nav>

    <p class="issues-subtitle">각 DB의 가장 최근 실행 결과 중, 임계치를 위반한 항목만 모아서 보여줍니다.</p>
    <div class="issues-toolbar">
        <button type="button" class="btn-secondary" onclick="loadIssues()">새로고침</button>
        <label for="auto-refresh-select">자동 새로고침:</label>
        <select id="auto-refresh-select">
            <option value="0">사용 안 함</option>
            <option value="10">10초</option>
            <option value="30">30초</option>
            <option value="60">1분</option>
            <option value="300">5분</option>
        </select>
    </div>

    <div id="issues-grid" class="issues-grid"></div>

    <script>
        const AUTO_REFRESH_STORAGE_KEY = 'issuesAutoRefreshSeconds';
        let autoRefreshTimer = null;

        function applyAutoRefresh(seconds) {
            if (autoRefreshTimer) {
                clearInterval(autoRefreshTimer);
                autoRefreshTimer = null;
            }
            if (seconds > 0) {
                autoRefreshTimer = setInterval(loadIssues, seconds * 1000);
            }
        }

        function initAutoRefresh() {
            const select = document.getElementById('auto-refresh-select');
            const saved = localStorage.getItem(AUTO_REFRESH_STORAGE_KEY);
            if (saved && select.querySelector(`option[value="${saved}"]`)) {
                select.value = saved;
            }
            applyAutoRefresh(Number(select.value));

            select.addEventListener('change', () => {
                localStorage.setItem(AUTO_REFRESH_STORAGE_KEY, select.value);
                applyAutoRefresh(Number(select.value));
            });
        }

        async function loadIssues() {
            const grid = document.getElementById('issues-grid');
            grid.innerHTML = '';

            try {
                const response = await fetch('/api/issues');
                if (!response.ok) {
                    showToast('이슈 목록 조회 실패', 'error');
                    return;
                }
                const issues = await response.json();

                if (issues.length === 0) {
                    const empty = document.createElement('p');
                    empty.className = 'issues-empty';
                    empty.textContent = '현재 임계치를 위반한 항목이 없습니다.';
                    grid.appendChild(empty);
                    return;
                }

                issues.forEach((issue) => {
                    grid.appendChild(buildIssueCard(issue));
                });
            } catch (error) {
                console.error('이슈 목록 조회 실패:', error);
                showToast('이슈 목록 조회 실패', 'error');
            }
        }

        function formatRunAt(runAt) {
            if (!runAt || runAt.length < 14) return runAt;
            return `${runAt.slice(0, 4)}-${runAt.slice(4, 6)}-${runAt.slice(6, 8)} ${runAt.slice(8, 10)}:${runAt.slice(10, 12)}:${runAt.slice(12, 14)}`;
        }

        function buildIssueCard(issue) {
            const card = document.createElement('div');
            card.className = 'issue-card issue-card-' + issue.level.toLowerCase();

            const header = document.createElement('div');
            header.className = 'issue-card-header';

            const badge = document.createElement('span');
            badge.className = 'issue-badge issue-badge-' + issue.level.toLowerCase();
            badge.textContent = issue.level;
            header.appendChild(badge);

            const dbname = document.createElement('span');
            dbname.className = 'issue-dbname';
            dbname.textContent = issue.dbname;
            header.appendChild(dbname);

            card.appendChild(header);

            const task = document.createElement('div');
            task.className = 'issue-task';
            task.textContent = issue.taskName;
            card.appendChild(task);

            const detail = document.createElement('div');
            detail.className = 'issue-detail';
            detail.textContent = `${issue.column}: ${issue.value}`;
            card.appendChild(detail);

            if (issue.message) {
                const message = document.createElement('div');
                message.className = 'issue-message';
                message.textContent = issue.message;
                card.appendChild(message);
            }

            const runAt = document.createElement('div');
            runAt.className = 'issue-runat';
            runAt.textContent = formatRunAt(issue.runAt);
            card.appendChild(runAt);

            return card;
        }

        loadIssues();
        initAutoRefresh();
    </script>
</body>
</html>

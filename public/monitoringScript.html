    <nav>
        <ul>
            <li><a href="index.html" class="nav-accent-1"><svg class="nav-icon" viewBox="0 0 16 16"><use href="#ic-db"></use></svg>Databases</a></li>

            <li class="nav-dropdown">
                <a href="dailyMonitoring.html" class="nav-accent-2 nav-dropdown-trigger nav-group-active"><svg class="nav-icon" viewBox="0 0 16 16"><use href="#ic-pulse"></use></svg>Monitoring <span class="nav-caret">&#9662;</span></a>
                <ul class="nav-dropdown-menu">

                        <a href="dailyMonitoring.html" class="nav-accent-2 nav-dropdown-trigger nav-group-active"><span class="nav-label"><svg class="nav-icon" viewBox="0 0 16 16"><use href="#ic-play"></use></svg>Daily Monitoring</span> <span class="nav-caret-sub">&#9656;</span></a>

                            <li><a href="monitoringScript.html" class="nav-accent-3 current"><svg class="nav-icon" viewBox="0 0 16 16"><use href="#ic-code"></use></svg>Scripts</a></li>
                            <li><a href="monitoringThresholds.html" class="nav-accent-4"><svg class="nav-icon" viewBox="0 0 16 16"><use href="#ic-gauge"></use></svg>Thresholds</a></li>

<div class="page-header-row">
    <h2 class="page-title">Scripts</h2>
    <button type="button" class="btn-secondary" onclick="openScriptModal()">Add Script</button>
</div>

<!-- 스크립트 목록을 표시하는 부분입니다. -->
<table id="script-list" class="table">
    <thead>
        <tr id="scriptHeaderRow"></tr>
    </thead>
    <tbody id="scriptTableBody"></tbody>
</table>

<!-- Add/Modify Script 팝업 -->
<div id="script-modal-overlay" class="modal-overlay hidden">
    <div class="modal">
        <div class="modal-header">
            <h2 id="script-modal-title">Add Script</h2>
            <button type="button" class="modal-close" onclick="closeModal('script-modal-overlay')">&times;</button>
        </div>
        <form id="script-form" onsubmit="submitScriptForm(event)">
            <label for="ID">ID:</label>
            <input type="number" id="ID" name="ID" required>

            <label for="NAME">NAME:</label>
            <input type="text" id="NAME" name="NAME" required>

            <label for="CATEGORY">CATEGORY:</label>
            <input type="text" id="CATEGORY" name="CATEGORY" required>

            <label for="DESCRIPTION">DESCRIPTION:</label>
            <input type="text" id="DESCRIPTION" name="DESCRIPTION" required>

            <label for="SQL_TEXT">SQL_TEXT:</label>
            <textarea id="SQL_TEXT" name="SQL_TEXT" required></textarea>

            <label for="SCHEDULE">SCHEDULE:</label>
            <input type="text" id="SCHEDULE" name="SCHEDULE" required>

            <label for="IS_ACTIVE">IS_ACTIVE:</label>
            <select id="IS_ACTIVE" name="IS_ACTIVE" required>
                <option value="Y">Y</option>
                <option value="N">N</option>
            </select>

            <button type="submit" id="script-submit-btn">Script 추가</button>
            <button type="button" class="btn-secondary" onclick="closeModal('script-modal-overlay')">취소</button>
        </form>
    </div>
</div>

<!-- JavaScript 코드입니다. -->
<script>
    async function fetchScripts() {
        try {

            const response = await fetch('/api/scriptlist');
            const { columns, rows } = await response.json();

            const headerRow = document.getElementById('scriptHeaderRow');
            const tableBody = document.getElementById('scriptTableBody');
            headerRow.innerHTML = '';
            tableBody.innerHTML = '';

            columns.forEach(column => {
                const th = document.createElement('th');
                th.textContent = column;
                headerRow.appendChild(th);
            });
            const actionsTh = document.createElement('th');
            actionsTh.textContent = 'ACTIONS';
            headerRow.appendChild(actionsTh);

            // 데이터 추가
            rows.forEach( row => {
            const tr = document.createElement('tr');

            columns.forEach(column => {
                const td = document.createElement('td');
                td.textContent = row[column];
                tr.appendChild(td);
            });

            const actionsTd = document.createElement('td');
            const modifyButton = document.createElement('button');
            const deleteButton = document.createElement('button');

            modifyButton.textContent = 'Modify';
            modifyButton.className = 'btn-secondary';
            deleteButton.textContent = 'Delete';
            deleteButton.className = 'btn-danger';

            const scriptConfig = {
                        id            : row.ID,
                        name          : row.NAME,
                        category      : row.CATEGORY,
                        description   : row.DESCRIPTION,
                        schedule      : row.SCHEDULE,
                        is_active     : row.IS_ACTIVE,
                        created_at    : row.CREATED_AT,
                        updated_at    : row.UPDATED_AT

            };

            const scriptId = row.ID
            modifyButton.onclick = () => modifyScript(event, scriptConfig);
            deleteButton.onclick = () => deletScript(event, scriptId, tr);

            actionsTd.appendChild(modifyButton);
            actionsTd.appendChild(deleteButton);
            tr.appendChild(actionsTd);

            tableBody.appendChild(tr);
            });
        } catch (error) {
            console.error('Error fetching users:', error);
        }
    }

    // script 정보 수정 함수 (팝업으로 편집)
    async function modifyScript(event, scriptConfig) {
        await openScriptModal(scriptConfig);
    }

    async function getSqlText(scriptConfig) {
        try {
            const response = await fetch('/api/getSqlText', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(scriptConfig)
            });

            if (response.ok) {
                const result = await response.json();
                return Object.values(result)[1];
            }
            showToast(`요청 실패: ${response.status}`, 'error');
        } catch (error) {
            console.error('Error:', error.message);
            showToast('요청 처리 중 오류가 발생했습니다.', 'error');
        }
    }

    // scriptConfig가 있으면 수정 모드, 없으면 추가 모드로 팝업을 연다.
    async function openScriptModal(scriptConfig) {
        const form = document.getElementById('script-form');
        form.reset();

        const isEdit = !!scriptConfig;
        document.getElementById('script-modal-title').textContent = isEdit ? 'Modify Script' : 'Add Script';
        document.getElementById('script-submit-btn').textContent = isEdit ? '수정 완료' : 'Script 추가';
        document.getElementById('ID').readOnly = isEdit;

        if (isEdit) {
            const sqlText = await getSqlText({ id: scriptConfig.id, name: scriptConfig.name });
            document.getElementById('ID').value = scriptConfig.id;
            document.getElementById('NAME').value = scriptConfig.name;
            document.getElementById('CATEGORY').value = scriptConfig.category;
            document.getElementById('DESCRIPTION').value = scriptConfig.description;
            document.getElementById('SQL_TEXT').value = sqlText || '';
            document.getElementById('SCHEDULE').value = scriptConfig.schedule;
            document.getElementById('IS_ACTIVE').value = scriptConfig.is_active;
        }

        openModal('script-modal-overlay');
    }

    async function submitScriptForm(event) {
        event.preventDefault();

        const scriptConfig = {
            id: document.getElementById('ID').value,
            name: document.getElementById('NAME').value,
            category: document.getElementById('CATEGORY').value,
            description: document.getElementById('DESCRIPTION').value,
            sql_text: document.getElementById('SQL_TEXT').value,
            schedule: document.getElementById('SCHEDULE').value,
            is_active: document.getElementById('IS_ACTIVE').value
        };

        if (!scriptConfig.id || !scriptConfig.name || !scriptConfig.sql_text || !scriptConfig.is_active) {
            showToast('필수 항목을 입력해주세요.', 'error');
            return;
        }

        const isEdit = document.getElementById('ID').readOnly;
        const url = isEdit ? '/api/modifyScript' : '/api/addScript';

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(scriptConfig)
            });

            if (response.ok) {
                showToast(isEdit ? 'Script 수정 완료.' : 'Script 추가 완료.');
                closeModal('script-modal-overlay');
                fetchScripts();
            } else {
                showToast(`요청 실패: ${response.status}`, 'error');
            }
        } catch (error) {
            console.error('Error:', error.message);
            showToast('요청 처리 중 오류가 발생했습니다.', 'error');
        }
    }


    // script 삭제 함수
    async function deletScript(event, scriptId, listItem) {
        console.log( 'DBMSID!!!!!!!', scriptId );
        try {
        const response = await fetch( '/api/deleteScript', {
                                                        method : 'POST',
                                                        headers: {
                                                                    'Content-Type': 'application/json',
                                                        },
                                                        body: JSON.stringify({scriptId}), // JSON 데이터 전송
        });

            if (response.ok) {
                showToast('스크립트 삭제 완료.');
                listItem.remove();
            } else {
                showToast(`요청 실패: ${response.status}`, 'error');
            }
        } catch (error) {
            console.error('Error:', error.message);
            showToast('요청 처리 중 오류가 발생했습니다.', 'error');
        }
    }

    showFlashMessageIfAny();
    fetchScripts();
    setupModalDismiss('script-modal-overlay');

</script>
</body>
</html>

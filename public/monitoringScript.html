<!DOCTYPE html>
<html lang="en">
<head>
    <!-- 페이지의 메타 정보를 설정합니다. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <script src="common.js"></script>
</head>

<body>
<!-- 페이지의 제목을 설정합니다. -->
<title> Monitoring Script</title>
<!-- 페이지 상단에 표시되는 제목입니다. -->
<a href="index.html">
<h1> Monitoring Script </h1>
</a> 

<!-- 네비게이션 링크 -->
<nav>
    <ul>
        <li><a href="index.html">DBMS List</a></li>
        <li><a href="dailyMonitoring.html">Daily Monitoring</a></li>
        <li><a href="addScript.html">Add Script</a></li>
        <li><a href="monitoringThresholds.html">Thresholds</a></li>
        <li><a href="tableSpec.html">Table Spec</a></li>
    </ul>
</nav>


<!-- 스크립트 목록을 표시하는 부분입니다. -->
<table id="script-list" class="table">
    <thead>
        <tr id="scriptHeaderRow"></tr>
    </thead>
    <tbody id="scriptTableBody"></tbody>
</table>

<!-- JavaScript 코드입니다. -->
<script>
    async function fetchScripts() {
        try {

            const response = await fetch('/api/scriptlist');
            const { columns, rows } = await response.json();

            const headerRow = document.getElementById('scriptHeaderRow');
            const tableBody = document.getElementById('scriptTableBody');

            columns.forEach(column => {
                const th = document.createElement('th');
                th.textContent = column;
                headerRow.appendChild(th);
            });
            const actionsTh = document.createElement('th');
            actionsTh.textContent = 'ACTIONS';
            headerRow.appendChild(actionsTh);

            // 데이터 추가
            rows.forEach( row => {
            const tr = document.createElement('tr');

            columns.forEach(column => {
                const td = document.createElement('td');
                td.textContent = row[column];
                tr.appendChild(td);
            });

            const actionsTd = document.createElement('td');
            const modifyButton = document.createElement('button');
            const deleteButton = document.createElement('button');

            modifyButton.textContent = 'Modify';
            modifyButton.className = 'btn-secondary';
            deleteButton.textContent = 'Delete';
            deleteButton.className = 'btn-danger';

            const scriptConfig = {
                        id            : row.ID,
                        name          : row.NAME,
                        category      : row.CATEGORY,
                        description   : row.DESCRIPTION,
                        schedule      : row.SCHEDULE,
                        is_active     : row.IS_ACTIVE,
                        created_at    : row.CREATED_AT,
                        updated_at    : row.UPDATED_AT

            };

            const scriptId = row.ID
            modifyButton.onclick = () => modifyScript(event, scriptConfig);
            deleteButton.onclick = () => deletScript(event, scriptId, tr);

            actionsTd.appendChild(modifyButton);
            actionsTd.appendChild(deleteButton);
            tr.appendChild(actionsTd);

            tableBody.appendChild(tr);
            });
        } catch (error) {
            console.error('Error fetching users:', error);
        }
    }

    // script 정보 수정 함수
    async function modifyScript(event, scriptConfig) {
        console.log(scriptConfig);
        localStorage.setItem("editData", JSON.stringify(scriptConfig));
        window.location.href = 'modifyScript.html?';
    }
  

    // script 삭제 함수
    async function deletScript(event, scriptId, listItem) {
        console.log( 'DBMSID!!!!!!!', scriptId );
        try {
        const response = await fetch( '/api/deleteScript', {
                                                        method : 'POST',
                                                        headers: {
                                                                    'Content-Type': 'application/json',
                                                        },
                                                        body: JSON.stringify({scriptId}), // JSON 데이터 전송
        });

            if (response.ok) {
                showToast('스크립트 삭제 완료.');
                listItem.remove();
            } else {
                showToast(`요청 실패: ${response.status}`, 'error');
            }
        } catch (error) {
            console.error('Error:', error.message);
            showToast('요청 처리 중 오류가 발생했습니다.', 'error');
        }
    }

    showFlashMessageIfAny();
    fetchScripts();

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <!-- 페이지의 메타 정보를 설정합니다. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <script src="common.js"></script>
</head>
<body>
    <!-- 페이지의 제목을 설정합니다. -->
    <title>Oracle DBMS Daily Monitoring</title>
    <!-- 페이지 상단에 표시되는 제목입니다. -->
    <a href="index.html">
    <h1>Daily Monitoring</h1>
    </a>

    <nav>
        <ul>
            <li><a href="index.html">DBMS List</a></li>
            <li><a href="monitoringScript.html">Monitoring Scripts</a></li>
            <li><a href="monitoringThresholds.html">Thresholds</a></li>
            <li><a href="tableSpec.html">Table Spec</a></li>
        </ul>
    </nav>

    <div id="tab-list" class="tab">
        <button class="tab-link active" onclick="openTab(this, 'tab1')" >DBMS LIST</button>
    </div>
    

    <div id="tab1" class="tab-content active">
            <!-- 상단 버튼 -->
            <button type="button" class="btn-secondary" onclick="checkAllDbms()">Check ALL</button>
            <button type="button" id="Run-button" onclick="getCheckedRows('runButton')">RUN</button>
            <button type="button" class="btn-secondary" onclick="getCheckedRows('downloadButton')">Download Report</button>
            <button type="button" class="btn-secondary" onclick="chooseDownloadFolder()">다운로드 위치 설정</button>
            <span id="download-folder-label" class="download-folder-label"></span>

            <div class="schedule-settings">
                <label><input type="checkbox" id="schedule-enabled"> 매일 자동 실행</label>
                <input type="time" id="schedule-time" value="07:00">
                <button type="button" class="btn-secondary" onclick="saveScheduleSettings()">자동 실행 대상으로 저장 (아래 체크된 DB)</button>
            </div>

            <table id="dbmses-list" class="table">
                <thead>
                    <tr id="headerRow">
                    <!-- Headers will be inserted here -->
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data will be inserted here -->
                </tbody>
            </table>
    </div>
    
     <!-- JavaScript 코드입니다. -->
     <script>
        function openTab(element, tabId) {

            //document란?
            //document 객체는 웹 브라우저에서 제공하는 **DOM (Document Object Model)**의 일부입니다.
            //HTML 문서를 JavaScript로 조작할 때 사용됩니다.
            //브라우저 환경에서만 접근 가능하며, Node.js와 같은 서버 환경에는 존재하지 않습니다.

            // 모든 탭 컨텐츠를 숨기기
            var tabContents = document.querySelectorAll('.tab-content');
                tabContents.forEach(function(content) {
                content.classList.remove('active');
            });

            // 모든 탭 버튼에서 active 클래스 제거
            var tabLinks = document.querySelectorAll('.tab-link');
                tabLinks.forEach(function(link) {
                link.classList.remove('active');
            });


            element.classList.add('active');
            // 클릭한 탭만 보이게 설정
            document.getElementById(tabId).classList.add('active');
            //evt.currentTarget.classList.add('active');
        }

             // DBMS 목록을 가져오는 함수
             // fetch 함수는 XMLHttpRequest 객체보다 최근에 나온, HTTP 요청 전송 기능을 제공하는 Web API다.
             // fetch 함수로 HTTP 요청하기
             // fetch 함수에는 HTTP 요청을 전송할 URL, HTTP 요청 메서드, HTTP 요청 헤더, 페이로드 등을 설정한 객체를 전달한다.

       async function createTable(url) {
        try {
            
            const response = await fetch(url);

            const { columns, rows } = await response.json();
            console.log('dbmses 배열 값 : ', columns); 
            const resultDiv =  document.getElementById('tab1');
            const tab =  document.getElementById('dbmses-list');
            const headerRow = document.getElementById('headerRow');
            const tableBody = document.getElementById('tableBody');
           


            const checkth = document.createElement('th');
            checkth.textContent = 'CHECK';
            headerRow.appendChild(checkth);

            // 컬럼명 추가
            columns.forEach(column => {
                const th = document.createElement('th');
                th.textContent = column;
                headerRow.appendChild(th);
            });

            // 데이터 추가
            rows.forEach(row => {
                const tr = document.createElement('tr');
                const checkcell = document.createElement('td');
                const checkbox = document.createElement('input');
                checkbox.type ='checkbox';
                checkbox.className='row-check';
                checkbox.checked = row['AUTO_SCHEDULE'] === 'Y';
                checkcell.appendChild(checkbox);
                tr.appendChild(checkcell);
                
                columns.forEach(column => {
                    const td = document.createElement('td');
                    td.textContent = row[column];
                    tr.appendChild(td);
                });
                tableBody.appendChild(tr);
           });
           tab.appendChild(tableBody);
           resultDiv.appendChild(tab);

           //document.body.appendChild(tab);
       } catch (error) {
         console.log('Error fetching users:', error);
      }}
       
       // dbms list 표 생성
       createTable('/api/dbmslist');
       loadScheduleConfig();

       // <!-- 예약 실행(자동 일일점검) 설정 조회/저장 -->
       async function loadScheduleConfig() {
            try {
                const res = await fetch('/api/schedule');
                const config = await res.json();
                document.getElementById('schedule-enabled').checked = config.enabled === 'Y';
                if (config.runTime) document.getElementById('schedule-time').value = config.runTime;
            } catch (error) {
                console.log('예약 실행 설정 조회 실패:', error);
            }
       }

       async function saveScheduleSettings() {
            const enabled = document.getElementById('schedule-enabled').checked ? 'Y' : 'N';
            const runTime = document.getElementById('schedule-time').value;
            if (!runTime) {
                showToast('실행 시각을 입력하세요', 'error');
                return;
            }

            const dbmsIds = [];
            document.querySelectorAll('.row-check').forEach(checkbox => {
                if (checkbox.checked) {
                    const row = checkbox.closest('tr');
                    const cells = row.getElementsByTagName('td');
                    dbmsIds.push(cells[1].innerText);
                }
            });

            try {
                const res = await fetch('/api/schedule', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enabled, runTime, dbmsIds }),
                });
                if (!res.ok) {
                    showToast('예약 실행 설정 저장 실패', 'error');
                    return;
                }
                showToast(`예약 실행 설정 저장 완료 (대상 ${dbmsIds.length}개, ${runTime})`);
            } catch (error) {
                console.error('예약 실행 설정 저장 실패:', error);
                showToast('예약 실행 설정 저장 실패', 'error');
            }
       }

       function checkAllDbms() {
        try {
            const checkboxes = document.querySelectorAll('.row-check');
            checkboxes.forEach((checkbox, index) => {
                checkbox.checked = true; 
            })
        } catch (error) {
        console.log('Error fetching :', error);
        }
       };

        function getCheckedRows(buttonName) {
            //모든 체크박스 요소 가져오기
            //정의: querySelectorAll() 메서드는 주어진 CSS 선택자와 일치하는 모든 요소를 NodeList 객체로 반환합니다.
            //반환값: NodeList (유사 배열 객체, 실제 배열은 아님)
            //**NodeList**는 forEach 같은 반복문을 사용할 수 있지만, 배열 메서드(map, filter 등)는 직접 사용 불가.
            const checkboxes = document.querySelectorAll('.row-check');

            
            checkboxes.forEach((checkbox, index) => {
                if (checkbox.checked) {  // 체크된 체크박스 확인
                    const row = checkbox.closest('tr');  // 현재 체크박스의 부모 행(tr) 가져오기
                    const cells = row.getElementsByTagName('td');  // 해당 행의 모든 셀(td) 가져오기
                    
                    const dbmsid = cells[1].innerText;

                    const dbConfig = {
                        id     : cells[1].innerText,
                        dbname : cells[2].innerText,
                        sid    : cells[4].innerText,
                        ip     : cells[5].innerText,
                        memo   : cells[7].innerText  
                    };

                    getMonResult(dbConfig, dbmsid, buttonName);
                    console.log(dbmsid);

                }
            });
                
            // 결과를 콘솔에 출력
            //console.log(selectedRows);
            //alert(JSON.stringify(selectedRows, null, 2));  // 팝업으로 출력
        }


        //<!--  DB에서 Monitoring Script 실행 후 결과 값을 가져온다.-->
        async function getMonResult(dbConfig, dbmsid, buttonName) {

            showToast(`${dbConfig.dbname} 점검 실행 중...`);

            const response = await fetch('/api/dbmslist/monResult', {
                                                        method : 'POST',
                                                        headers: {
                                                                    'Content-Type': 'application/json',
                                                        },
                                                        body: JSON.stringify({dbmsid}), // JSON 데이터 전송
            });

            if (!response.ok) {
                showToast(`${dbConfig.dbname} 점검 실행 실패: ${response.status}`, 'error');
                return;
            }

            const  results = await response.json();
            //console.log('값!!! 가져오기 성공 ', results);

            console.log('results task_name' , results);

            const failedCount = results.filter(r => !r.success).length;
            if (failedCount > 0) {
                showToast(`${dbConfig.dbname} 점검 완료 (${failedCount}건 실패)`, 'error');
            } else {
                showToast(`${dbConfig.dbname} 점검 완료`);
            }

            addResultTab(dbConfig, results);

            const now = new Date(); 
            const y = now.getFullYear(); 
            const m = String(now.getMonth()+1); 
            const d = now.getDate();
            const resultFileName = dbConfig.dbname + "_" + y + "_" + m + "_" + d + ".html";

            // report 다운로드
            if ( buttonName === 'downloadButton') {
                const tab = document.getElementById(dbConfig.dbname);
                openTab(tab, dbConfig.dbname);
                //const html = document.getElementById(dbname).innerHTML;
                const html = document.documentElement.outerHTML;
                saveHtmlToFolder(html, resultFileName );
            }
            //alert(JSON.stringify(result, null, 2));  // 팝업으로 출력
        }

        //<!--  실행 결과 탭 화면 생성 -->
        async function addResultTab( dbConfig, results) {
            const dbname = dbConfig.dbname; 
            console.log('addResultTab columns' , results);
            console.log('results task_name' , results[0].task_name);
        
            
            const tabList =  document.getElementById('tab-list');
            //<button class="tab-link" onclick="openTab(event, 'tab3')">탭 3</button>
            const button =  document.createElement('button');
            // 탭 버튼에 클래스 추가
            button.className = 'tab-link active';
            // 탭 버튼에 텍스트 추가
            button.textContent = dbname;
            // 탭 버튼에 이벤트 추가 
            button.onclick = function() { 
                openTab(this, dbname);
            }
            
            // tabList에 tab추가 
            tabList.appendChild(button);
            // <div id="tab2" class="tab-content">
            //     <h3>탭 2 내용</h3>
            //     <p>여기에 탭 2의 내용을 넣으세요.</p>
            // </div>

            const resultDiv =  document.createElement('div');
            resultDiv.id = dbname;
            resultDiv.className = 'tab-content'; 
            resultDiv.innerHTML = `<h3>${dbname}</h3>`;


            Object.entries(results).forEach( ([checkName, result], index ) => {
                const monInfo = document.createElement('h3');
                monInfo.textContent = results[index].task_name; 
                monInfo.id = "monInfo";
                resultDiv.appendChild(monInfo);
                
                // table 생성 
                const tab =  document.createElement('table');
                
                // table에 클래스 추가 
                tab.className = 'table'; 
                const headerRow = document.createElement('thead');
                const tableBody = document.createElement('tbody');
                 

                if ( result.rows.length === 0 ) { 
                    const noResult = document.createElement('h3');
                    noResult.id = 'NoResult';
                    noResult.textContent = "No results found.";
                    resultDiv.appendChild(noResult);
                }
                else {
                    // 컬럼명 추가
                    result.columns.forEach(column => {
                            const th = document.createElement('th');
                            th.textContent = column;
                            headerRow.appendChild(th);
                    });

                    // 데이터 추가
                    result.rows.forEach(row => {
                        const tr = document.createElement('tr');
                        const alerts = row._alerts || {};

                        result.columns.forEach(column => {
                                const td = document.createElement('td');
                                td.textContent = row[column];
                                if (alerts[column]) {
                                    td.classList.add('cell-' + alerts[column].level.toLowerCase());
                                    td.title = alerts[column].message || '';
                                }
                                tr.appendChild(td);
                        });

                        tableBody.appendChild(tr);
                        tab.appendChild(headerRow);
                        tab.appendChild(tableBody);
                        resultDiv.appendChild(tab);
                        document.body.appendChild(resultDiv);
                    });
                }
        });
    
        }

        updateDownloadFolderLabel();

     </script>
 </body>
 </html>

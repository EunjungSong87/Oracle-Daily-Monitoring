<!-- addDbms.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="common.js"></script>
    <title>Add DBMS</title>
</head>
<body>

<a href="index.html">
<h1>Add DBMS</h1>
</a>

<nav>
    <ul>
        <li><a href="index.html">DBMS List</a></li>
        <li><a href="dailyMonitoring.html">Daily Monitoring</a></li>
        <li><a href="monitoringScript.html">Monitoring Scripts</a></li>
        <li><a href="monitoringThresholds.html">Thresholds</a></li>
        <li><a href="tableSpec.html">Table Spec</a></li>
    </ul>
</nav>

<!-- DBMS 추가 폼입니다. -->
<form id="add-dbms" onsubmit="addDbms(event)">
    <label for="DBMS">DBMS:</label>
    <input type="text" id="DBMS" name="DBMS" required><br>

    <label for="USERNAME">USERNAME:</label>
    <input type="text" id="USERNAME" name="USERNAME" required><br>

    <label for="PASSWORD">PASSWORD:</label>
    <input type="text" id="PASSWORD" name="PASSWORD" required><br>

    <label for="SID">SID:</label>
    <input type="text" id="SID" name="SID" required><br>

    <label for="IP">IP:</label>
    <input type="text" id="IP" name="IP" required><br>

    <label for="PORT">PORT:</label>
    <input type="text" id="PORT" name="PORT" required><br>

    <label for="MEMO">MEMO:</label>
    <textarea id="MEMO" name="MEMO" ></textarea><br>

    <!-- 게시글 작성 버튼 -->
    <button type="submit">DBMS 추가</button>

    <!-- 뒤로가기 버튼 -->
    <button type="button" class="btn-secondary" onclick="goBack()">뒤로 가기</button>
</form>

<!-- 게시글 작성 스크립트 파일을 로드합니다. -->
<script>
    async function addDbms(evnet) {
        event.preventDefault();
        const dbName   =  document.getElementById('DBMS');
        const userName =  document.getElementById('USERNAME');
        const passWord =  document.getElementById('PASSWORD');
        const sid    =    document.getElementById('SID');
        const ip     =    document.getElementById('IP');
        const port   =    document.getElementById('PORT');
        const memo   =    document.getElementById('MEMO');


        if (!dbName.value || !userName.value || !passWord.value || !sid.value || !ip.value || !port.value) {
            showToast('필수 항목을 입력해주세요.', 'error');
            return;
        }

        const dbConfig = {
            dbname: dbName.value,
            username: userName.value,
            password: passWord.value,
            sid: sid.value,
            ip: ip.value,
            port: port.value,
            memo: memo.value
        };

        try {
            const response = await fetch('/api/addDbms', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dbConfig)
            });

            if (response.ok) {
                setFlashMessage('DBMS 추가 완료.');
                window.location.href = 'index.html'
            } else {
                showToast(`요청 실패: ${response.status}`, 'error');
            }
        } catch (error) {
            console.error('Error:', error.message);
            showToast('요청 처리 중 오류가 발생했습니다.', 'error');
        }
    }

    function goBack() {
        window.history.back();
    }
</script>
</body>
</html>

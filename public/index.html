<!-- index.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <!-- 페이지의 메타 정보를 설정합니다. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <script src="common.js"></script>
</head>
<body>
    <!-- 페이지의 제목을 설정합니다. -->
    <title>DBMS Daily Monitoring</title>
    <!-- 페이지 상단에 표시되는 제목입니다. -->
    <h1>DBMS Daily Monitoring</h1>
    
    <!-- 네비게이션 링크 -->
    <nav>
        <ul>
            <!-- DBMS 추가 페이지 링크 -->
            <li><a href="addDbms.html">Add DBMS </a></li>
            <!-- 일일점검 수행 링크 -->
            <li><a href="dailyMonitoring.html">Daily Monitoring </a></li>
            <!-- 일일점검 스크립트 목록 링크 -->
            <li><a href="monitoringScript.html">Monitoring Scripts </a></li>
            <!-- 임계치 목록 링크 -->
            <li><a href="monitoringThresholds.html">Thresholds </a></li>
            <!-- 테이블 명세서 링크 -->
            <li><a href="tableSpec.html">Table Spec </a></li>
        </ul>
    </nav>

    <!-- DBMS 목록을 표시하는 부분입니다. -->
    <table id="dbmses-list" class="table">
        <thead>
            <tr id="dbmsHeaderRow"></tr>
        </thead>
        <tbody id="dbmsTableBody"></tbody>
    </table>

    <!-- JavaScript 코드입니다. -->
    <script>
            async function fetchDbmses() {
                try {
                    const response = await fetch('/main/dbmslist');
                    const { columns, rows } = await response.json();

                    const headerRow = document.getElementById('dbmsHeaderRow');
                    const tableBody = document.getElementById('dbmsTableBody');

                    // 헤더 추가
                    columns.forEach(column => {
                        const th = document.createElement('th');
                        th.textContent = column;
                        headerRow.appendChild(th);
                    });
                    const actionsTh = document.createElement('th');
                    actionsTh.textContent = 'ACTIONS';
                    headerRow.appendChild(actionsTh);

                    // 데이터 추가
                    rows.forEach( row => {
                    const tr = document.createElement('tr');

                    columns.forEach(column => {
                        const td = document.createElement('td');
                        td.textContent = row[column];
                        tr.appendChild(td);
                    });

                    const actionsTd = document.createElement('td');
                    const modifyButton = document.createElement('button');
                    const deleteButton = document.createElement('button');

                    modifyButton.textContent = 'Modify';
                    modifyButton.className = 'btn-secondary';
                    deleteButton.textContent = 'Delete';
                    deleteButton.className = 'btn-danger';

                    const dbConfig = {
                                id       : row.ID,
                                dbname   : row.DBNAME,
                                username : row.USERNAME,
                                password : row.PASSWORD,
                                sid      : row.SID,
                                ip       : row.IP,
                                port     : row.PORT,
                                memo     : row.MEMO
                    };

                    const dbmsId = row.ID
                    modifyButton.onclick = () => modifyDBMS(event, dbConfig);
                    deleteButton.onclick = () => deleteDBMS(event, dbmsId, tr);

                    actionsTd.appendChild(modifyButton);
                    actionsTd.appendChild(deleteButton);
                    tr.appendChild(actionsTd);

                    tableBody.appendChild(tr);
                    });
                } catch (error) {
                    //console.error('Error fetching users:', error);
                }
            }



            // dbms 정보 수정 함수
            async function modifyDBMS(event, dbConfig) {
                console.log(dbConfig);
                localStorage.setItem("editData", JSON.stringify(dbConfig));
                window.location.href = 'modifyDbms.html?';
            }


            // dbms 삭제 함수
            async function deleteDBMS(event, dbmsId, listItem) {
                console.log( 'DBMSID!!!!!!!', dbmsId );
                try {
                const response = await fetch( '/api/deleteDbms', {
                                                                method : 'POST',
                                                                headers: {
                                                                            'Content-Type': 'application/json',
                                                                },
                                                                body: JSON.stringify({dbmsId}), // JSON 데이터 전송
                });

                    if (response.ok) {
                        showToast('DBMS 삭제 완료.');
                        listItem.remove();
                    } else {
                        showToast(`요청 실패: ${response.status}`, 'error');
                    }
                } catch (error) {
                    console.error('Error:', error.message);
                    showToast('요청 처리 중 오류가 발생했습니다.', 'error');
                }
            }

            showFlashMessageIfAny();
            fetchDbmses();

    </script>
</body>
</html>

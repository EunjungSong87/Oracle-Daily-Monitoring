<h2 class="page-title">Table Spec (테이블 명세서)</h2>

<form id="table-spec-form" onsubmit="event.preventDefault()">
    <label for="DBMS_ID">DBMS:</label>
    <select id="DBMS_ID" name="DBMS_ID" required></select>

    <label>스키마 (SCHEMA) — 여러 개 선택 가능:</label>
    <div style="margin-bottom: 16px;">
        <div style="margin-bottom:10px;">
            <button type="button" class="btn-secondary" onclick="toggleAllSchemas(true)">전체 선택</button>
            <button type="button" class="btn-secondary" onclick="toggleAllSchemas(false)">전체 해제</button>
        </div>
        <div id="schema-checkbox-list" class="checkbox-panel">DBMS를 먼저 선택하세요</div>
    </div>

    <label>추출 범위:</label>
    <div style="margin-bottom: 16px;">
        <label style="display:inline-block; text-transform:none; font-weight:normal; margin-right:20px;">
            <input type="radio" name="SCOPE" value="ALL" checked onchange="onScopeChange()"> 스키마 전체
        </label>
        <label style="display:inline-block; text-transform:none; font-weight:normal;">
            <input type="radio" name="SCOPE" value="SELECT" onchange="onScopeChange()"> 개별 테이블 선택
        </label>
    </div>

    <div id="table-picker" style="display:none;">
        <label>테이블 선택 (스키마별로):</label>
        <div id="table-picker-groups"></div>
    </div>

    <label for="TABLES_PER_SHEET">시트당 테이블 수:</label>
    <input type="number" id="TABLES_PER_SHEET" name="TABLES_PER_SHEET" value="20" min="1" style="max-width: 120px;">

    <div style="margin-top: 16px;">
        <button type="button" id="download-button" onclick="downloadSpec()">엑셀 다운로드</button>
    </div>
</form>

<script>
    async function loadDbmsList() {
        try {
            const response = await fetch('/api/dbmslist');
            const { rows } = await response.json();
            const select = document.getElementById('DBMS_ID');
            rows.forEach(row => {
                const option = document.createElement('option');
                option.value = row.ID;
                option.textContent = `${row.ID} - ${row.DBNAME}`;
                select.appendChild(option);
            });
            if (rows.length > 0) {
                await loadSchemas();
            }
        } catch (error) {
            console.error('Error loading dbms list:', error.message);
            showToast('DBMS 목록 조회 실패', 'error');
        }
    }

    // 스키마 목록을 체크박스로 렌더링합니다 (여러 개 동시 선택 가능).
    // 처음 불러왔을 때는 첫 번째 스키마만 기본으로 체크해둡니다.
    async function loadSchemas() {
        const listDiv = document.getElementById('schema-checkbox-list');
        listDiv.textContent = '불러오는 중...';

        try {
            const dbmsid = document.getElementById('DBMS_ID').value;
            const response = await fetch('/api/tableSpec/schemas', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ dbmsid })
            });

            if (!response.ok) {
                showToast('스키마 목록 조회 실패', 'error');
                listDiv.textContent = '조회 실패';
                return;
            }

            const schemas = await response.json();
            listDiv.innerHTML = '';

            if (schemas.length === 0) {
                listDiv.textContent = '스키마가 없습니다.';
                return;
            }

            schemas.forEach((owner, idx) => {
                const label = document.createElement('label');
                label.className = 'checkbox-row';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = 'schema-checkbox';
                checkbox.value = owner;
                checkbox.checked = idx === 0;
                checkbox.style.marginRight = '8px';
                checkbox.onchange = onSchemaToggle;

                label.appendChild(checkbox);
                label.appendChild(document.createTextNode(owner));
                listDiv.appendChild(label);
            });

            if (document.querySelector('input[name="SCOPE"]:checked').value === 'SELECT') {
                await rebuildTableGroups();
            }
        } catch (error) {
            console.error('Error loading schemas:', error.message);
            showToast('스키마 목록 조회 중 오류가 발생했습니다.', 'error');
        }
    }

    function toggleAllSchemas(checked) {
        document.querySelectorAll('.schema-checkbox').forEach(cb => { cb.checked = checked; });
        onSchemaToggle();
    }

    function onSchemaToggle() {
        if (document.querySelector('input[name="SCOPE"]:checked').value === 'SELECT') {
            rebuildTableGroups();
        }
    }

    function onScopeChange() {
        const scope = document.querySelector('input[name="SCOPE"]:checked').value;
        const picker = document.getElementById('table-picker');
        if (scope === 'SELECT') {
            picker.style.display = 'block';
            rebuildTableGroups();
        } else {
            picker.style.display = 'none';
        }
    }

    // 체크된 스키마마다 하나씩 "테이블 선택" 그룹을 만들어둡니다.
    // 이미 만들어져 있는 스키마 그룹은 다시 불러오지 않고, 체크 해제된
    // 스키마의 그룹만 지웁니다.
    async function rebuildTableGroups() {
        const groupsContainer = document.getElementById('table-picker-groups');
        const checkedSchemas = Array.from(document.querySelectorAll('.schema-checkbox:checked')).map(cb => cb.value);

        Array.from(groupsContainer.children).forEach(group => {
            if (!checkedSchemas.includes(group.dataset.owner)) group.remove();
        });

        if (checkedSchemas.length === 0) {
            groupsContainer.innerHTML = '<p class="issues-empty">먼저 위에서 스키마를 선택하세요.</p>';
            return;
        }
        if (groupsContainer.querySelector('.issues-empty')) {
            groupsContainer.innerHTML = '';
        }

        for (const owner of checkedSchemas) {
            if (groupsContainer.querySelector(`.schema-table-group[data-owner="${owner}"]`)) continue;
            groupsContainer.appendChild(await buildSchemaTableGroup(owner));
        }
    }

    async function buildSchemaTableGroup(owner) {
        const group = document.createElement('div');
        group.className = 'schema-table-group';
        group.dataset.owner = owner;

        const header = document.createElement('div');
        header.className = 'schema-table-group-header';

        const title = document.createElement('strong');
        title.textContent = owner;
        header.appendChild(title);

        const selectAllBtn = document.createElement('button');
        selectAllBtn.type = 'button';
        selectAllBtn.className = 'btn-secondary';
        selectAllBtn.textContent = '전체 선택';
        selectAllBtn.onclick = () => toggleSchemaTables(owner, true);
        header.appendChild(selectAllBtn);

        const deselectAllBtn = document.createElement('button');
        deselectAllBtn.type = 'button';
        deselectAllBtn.className = 'btn-secondary';
        deselectAllBtn.textContent = '전체 해제';
        deselectAllBtn.onclick = () => toggleSchemaTables(owner, false);
        header.appendChild(deselectAllBtn);

        group.appendChild(header);

        const listDiv = document.createElement('div');
        listDiv.className = 'checkbox-panel';
        listDiv.textContent = '불러오는 중...';
        group.appendChild(listDiv);

        try {
            const dbmsid = document.getElementById('DBMS_ID').value;
            const response = await fetch('/api/tableSpec/tables', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ dbmsid, owner })
            });

            if (!response.ok) {
                listDiv.textContent = '조회 실패';
                return group;
            }

            const tableNames = await response.json();
            listDiv.innerHTML = '';

            if (tableNames.length === 0) {
                listDiv.textContent = '테이블이 없습니다.';
                return group;
            }

            tableNames.forEach(tableName => {
                const label = document.createElement('label');
                label.className = 'checkbox-row';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = 'table-checkbox';
                checkbox.dataset.owner = owner;
                checkbox.value = tableName;
                checkbox.style.marginRight = '8px';

                label.appendChild(checkbox);
                label.appendChild(document.createTextNode(tableName));
                listDiv.appendChild(label);
            });
        } catch (error) {
            console.error('Error loading tables:', error.message);
            listDiv.textContent = '조회 중 오류가 발생했습니다.';
        }

        return group;
    }

    function toggleSchemaTables(owner, checked) {
        document.querySelectorAll(`.table-checkbox[data-owner="${owner}"]`).forEach(cb => { cb.checked = checked; });
    }

    async function downloadSpec() {
        const dbmsid = document.getElementById('DBMS_ID').value;
        const checkedSchemas = Array.from(document.querySelectorAll('.schema-checkbox:checked')).map(cb => cb.value);
        const scope = document.querySelector('input[name="SCOPE"]:checked').value;

        if (!dbmsid) {
            showToast('DBMS를 선택해주세요.', 'error');
            return;
        }
        if (checkedSchemas.length === 0) {
            showToast('스키마를 하나 이상 선택해주세요.', 'error');
            return;
        }

        const schemas = {};
        if (scope === 'ALL') {
            checkedSchemas.forEach(owner => { schemas[owner] = 'ALL'; });
        } else {
            for (const owner of checkedSchemas) {
                const tables = Array.from(document.querySelectorAll(`.table-checkbox[data-owner="${owner}"]:checked`)).map(cb => cb.value);
                if (tables.length === 0) {
                    showToast(`"${owner}" 스키마에서 테이블을 하나 이상 선택해주세요.`, 'error');
                    return;
                }
                schemas[owner] = tables;
            }
        }

        const tablesPerSheet = Number(document.getElementById('TABLES_PER_SHEET').value) || 20;

        const button = document.getElementById('download-button');
        button.disabled = true;
        showToast('엑셀 생성 중...');

        try {
            const response = await fetch('/api/tableSpec/download', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ dbmsid, schemas, tablesPerSheet })
            });

            if (!response.ok) {
                const err = await response.json().catch(() => ({}));
                showToast(err.message || `요청 실패: ${response.status}`, 'error');
                return;
            }

            let filename = 'table_spec.xlsx';
            const disposition = response.headers.get('Content-Disposition');
            const match = disposition && disposition.match(/filename="?([^"]+)"?/);
            if (match) filename = match[1];

            const blob = await response.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            showToast('엑셀 다운로드 완료.');
        } catch (error) {
            console.error('Error:', error.message);
            showToast('다운로드 중 오류가 발생했습니다.', 'error');
        } finally {
            button.disabled = false;
        }
    }

    document.getElementById('DBMS_ID').addEventListener('change', () => {
        document.getElementById('table-picker-groups').innerHTML = '';
        loadSchemas();
    });

    loadDbmsList();
</script>

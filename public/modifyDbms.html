<!-- modifyDbms.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="common.js"></script>
    <title>Modify DBMS Info</title>
</head>
<body>

<a href="index.html">
<h1>Modify DBMS Info</h1>
</a>

<nav>
    <ul>
        <li><a href="index.html">DBMS List</a></li>
        <li><a href="dailyMonitoring.html">Daily Monitoring</a></li>
        <li><a href="monitoringScript.html">Monitoring Scripts</a></li>
        <li><a href="monitoringThresholds.html">Thresholds</a></li>
        <li><a href="tableSpec.html">Table Spec</a></li>
        <li><a href="history.html">Run History</a></li>
    </ul>
</nav>

<!-- DBMS 추가 폼입니다. -->
<form id="modify-dbms" onsubmit="modifyDbms(event)">
    <label for="ID">ID:</label>
    <input type="number" id="ID" name="ID" required><br>

    <label for="DBMS">DBMS:</label>
    <input type="text" id="DBMS" name="DBMS" required><br>

    <label for="USERNAME">USERNAME:</label>
    <input type="text" id="USERNAME" name="USERNAME" required><br>

    <label for="PASSWORD">PASSWORD (변경하지 않으려면 비워두세요):</label>
    <input type="text" id="PASSWORD" name="PASSWORD" placeholder="변경하지 않으려면 비워두세요"><br>

    <label for="SID">SID:</label>
    <input type="text" id="SID" name="SID" required><br>

    <label for="IP">IP:</label>
    <input type="text" id="IP" name="IP" required><br>

    <label for="PORT">PORT:</label>
    <input type="text" id="PORT" name="PORT" required><br>

    <label for="MEMO">MEMO:</label>
    <textarea id="MEMO" name="MEMO" ></textarea><br>

    <!-- 게시글 작성 버튼 -->
    <button type="submit">수정 완료</button>

    <!-- 뒤로가기 버튼 -->
    <button type="button" class="btn-secondary" onclick="goBack()">뒤로 가기</button>
</form>

<!-- 게시글 작성 스크립트 파일을 로드합니다. -->
<script>
    window.onload = function () {
        const data = JSON.parse(localStorage.getItem("editData"));
        //console.log( data);
        document.getElementById('ID').value = data.id;
        document.getElementById('DBMS').value = data.dbname;
        document.getElementById('USERNAME').value = data.username;
        // 목록 조회에는 비밀번호가 포함되지 않으므로 빈 값으로 둡니다 (비워두면 기존 값 유지).
        document.getElementById('SID').value = data.sid;
        document.getElementById('IP').value = data.ip;
        document.getElementById('PORT').value = data.port;
        document.getElementById('MEMO').value = data.memo;

    };


    async function modifyDbms(evnet) {
        event.preventDefault();
        const data = JSON.parse(localStorage.getItem("editData"));
        const id       =  document.getElementById('ID');
        const dbName   =  document.getElementById('DBMS');
        const userName =  document.getElementById('USERNAME');
        const passWord =  document.getElementById('PASSWORD');
        const sid    =    document.getElementById('SID');
        const ip     =    document.getElementById('IP');
        const port   =    document.getElementById('PORT');
        const memo   =    document.getElementById('MEMO');


        if (!id.value || !dbName.value || !userName.value || !sid.value || !ip.value || !port.value) {
            showToast('필수 항목을 입력해주세요.', 'error');
            return;
        }

        const dbConfig = {
            id : id.value,
            dbname: dbName.value,
            username: userName.value,
            password: passWord.value,
            sid: sid.value,
            ip: ip.value,
            port: port.value,
            memo: memo.value
        };

        try {
            const response = await fetch('/api/modifyDbms', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dbConfig)
            });

            if (response.ok) {
                setFlashMessage('DBMS 수정 완료.');
                window.location.href = 'index.html'
            } else {
                showToast(`요청 실패: ${response.status}`, 'error');
            }
        } catch (error) {
            console.error('Error:', error.message);
            showToast('요청 처리 중 오류가 발생했습니다.', 'error');
        }
    }

    function goBack() {
        window.history.back();
    }
</script>
</body>
</html>

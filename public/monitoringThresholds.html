<div class="page-header-row">
    <h2 class="page-title">Thresholds</h2>
    <button type="button" id="add-threshold-btn" class="btn-secondary" onclick="openThresholdModal()">Add Threshold</button>
</div>

<table id="threshold-list" class="table">
    <thead>
        <tr id="thresholdHeaderRow"></tr>
    </thead>
    <tbody id="thresholdTableBody"></tbody>
</table>

<!-- Add/Modify Threshold 팝업 -->
<div id="threshold-modal-overlay" class="modal-overlay hidden">
    <div class="modal">
        <div class="modal-header">
            <h2 id="threshold-modal-title">Add Threshold</h2>
            <button type="button" class="modal-close" onclick="closeModal('threshold-modal-overlay')">&times;</button>
        </div>
        <form id="threshold-form" onsubmit="submitThresholdForm(event)">
            <div id="threshold-id-row" class="field-hidden">
                <label for="THRESHOLD_ID">ID:</label>
                <input type="number" id="THRESHOLD_ID" name="THRESHOLD_ID" readonly>
            </div>

            <label for="TASK_ID">점검 항목 (TASK):</label>
            <select id="TASK_ID" name="TASK_ID" required></select>

            <label for="COLUMN_NAME">컬럼명 (결과 테이블의 컬럼명과 정확히 일치해야 함):</label>
            <input type="text" id="COLUMN_NAME" name="COLUMN_NAME" placeholder="예: USED(%)" required>

            <label for="CONDITION_TYPE">조건 유형:</label>
            <select id="CONDITION_TYPE" name="CONDITION_TYPE" required>
                <option value="NUMERIC">NUMERIC (숫자 비교)</option>
                <option value="STRING">STRING (문자열 일치)</option>
                <option value="PATTERN">PATTERN (문자열 포함)</option>
            </select>

            <label for="OPERATOR">연산자:</label>
            <select id="OPERATOR" name="OPERATOR" required>
                <option value=">">&gt;</option>
                <option value=">=">&gt;=</option>
                <option value="<">&lt;</option>
                <option value="<=">&lt;=</option>
                <option value="=">=</option>
                <option value="!=">!=</option>
                <option value="LIKE">LIKE (포함)</option>
            </select>

            <label for="THRESHOLD">기준값:</label>
            <input type="text" id="THRESHOLD" name="THRESHOLD" placeholder="예: 90" required>

            <label for="CLEVEL">알림 레벨:</label>
            <select id="CLEVEL" name="CLEVEL" required>
                <option value="WARN">WARN</option>
                <option value="ERROR">ERROR</option>
                <option value="INFO">INFO</option>
            </select>

            <label for="MESSAGE">메시지:</label>
            <input type="text" id="MESSAGE" name="MESSAGE" placeholder="예: 테이블스페이스 사용률 90% 초과">

            <label for="IS_ACTIVE">활성화 여부:</label>
            <select id="IS_ACTIVE" name="IS_ACTIVE" required>
                <option value="Y">Y</option>
                <option value="N">N</option>
            </select>

            <button type="submit" id="threshold-submit-btn">임계치 추가</button>
            <button type="button" class="btn-secondary" onclick="closeModal('threshold-modal-overlay')">취소</button>
        </form>
    </div>
</div>

<script>
    let canManage = false;

    async function fetchThresholds() {
        try {
            const response = await fetch('/api/thresholdlist');
            const { columns, rows } = await response.json();
            const headerRow = document.getElementById('thresholdHeaderRow');
            const tableBody = document.getElementById('thresholdTableBody');
            headerRow.innerHTML = '';
            tableBody.innerHTML = '';

            columns.forEach(column => {
                const th = document.createElement('th');
                th.textContent = column;
                headerRow.appendChild(th);
            });
            if (canManage) {
                const actionsTh = document.createElement('th');
                actionsTh.textContent = 'ACTIONS';
                headerRow.appendChild(actionsTh);
            }

            rows.forEach(row => {
                const tr = document.createElement('tr');

                columns.forEach(column => {
                    const td = document.createElement('td');
                    td.textContent = row[column];
                    tr.appendChild(td);
                });

                if (!canManage) {
                    tableBody.appendChild(tr);
                    return;
                }

                const actionsTd = document.createElement('td');
                const modifyButton = document.createElement('button');
                const deleteButton = document.createElement('button');

                modifyButton.textContent = 'Modify';
                modifyButton.className = 'btn-secondary';
                deleteButton.textContent = 'Delete';
                deleteButton.className = 'btn-danger';

                const thresholdConfig = {
                    id: row.ID,
                    task_id: row.TASK_ID,
                    task_name: row.TASK_NAME,
                    column_name: row.COLUMN_NAME,
                    condition_type: row.CONDITION_TYPE,
                    operator: row.OPERATOR,
                    threshold: row.THRESHOLD,
                    clevel: row.CLEVEL,
                    message: row.MESSAGE,
                    is_active: row.IS_ACTIVE
                };

                const thresholdId = row.ID;
                modifyButton.onclick = () => modifyThreshold(event, thresholdConfig);
                deleteButton.onclick = () => deleteThreshold(event, thresholdId, tr);

                actionsTd.appendChild(modifyButton);
                actionsTd.appendChild(deleteButton);
                tr.appendChild(actionsTd);

                tableBody.appendChild(tr);
            });
        } catch (error) {
            console.error('Error fetching thresholds:', error);
        }
    }

    async function modifyThreshold(event, thresholdConfig) {
        await openThresholdModal(thresholdConfig);
    }

    async function loadTaskOptions(selectedTaskId) {
        try {
            const response = await fetch('/api/scriptlist');
            const { rows } = await response.json();
            const select = document.getElementById('TASK_ID');
            select.innerHTML = '';
            rows.forEach(row => {
                const option = document.createElement('option');
                option.value = row.ID;
                option.textContent = `${row.ID} - ${row.NAME}`;
                if (String(row.ID) === String(selectedTaskId)) option.selected = true;
                select.appendChild(option);
            });
        } catch (error) {
            console.error('Error loading tasks:', error.message);
        }
    }

    // thresholdConfig가 있으면 수정 모드, 없으면 추가 모드로 팝업을 연다.
    async function openThresholdModal(thresholdConfig) {
        const form = document.getElementById('threshold-form');
        form.reset();

        const isEdit = !!thresholdConfig;
        document.getElementById('threshold-modal-title').textContent = isEdit ? 'Modify Threshold' : 'Add Threshold';
        document.getElementById('threshold-submit-btn').textContent = isEdit ? '수정 완료' : '임계치 추가';
        document.getElementById('threshold-id-row').classList.toggle('field-hidden', !isEdit);

        await loadTaskOptions(isEdit ? thresholdConfig.task_id : undefined);

        if (isEdit) {
            document.getElementById('THRESHOLD_ID').value = thresholdConfig.id;
            document.getElementById('COLUMN_NAME').value = thresholdConfig.column_name;
            document.getElementById('CONDITION_TYPE').value = thresholdConfig.condition_type;
            document.getElementById('OPERATOR').value = thresholdConfig.operator;
            document.getElementById('THRESHOLD').value = thresholdConfig.threshold;
            document.getElementById('CLEVEL').value = thresholdConfig.clevel;
            document.getElementById('MESSAGE').value = thresholdConfig.message || '';
            document.getElementById('IS_ACTIVE').value = thresholdConfig.is_active;
        }

        openModal('threshold-modal-overlay');
    }

    async function submitThresholdForm(event) {
        event.preventDefault();

        const isEdit = !document.getElementById('threshold-id-row').classList.contains('field-hidden');
        const thresholdInfo = {
            task_id: document.getElementById('TASK_ID').value,
            column_name: document.getElementById('COLUMN_NAME').value,
            condition_type: document.getElementById('CONDITION_TYPE').value,
            operator: document.getElementById('OPERATOR').value,
            threshold: document.getElementById('THRESHOLD').value,
            clevel: document.getElementById('CLEVEL').value,
            message: document.getElementById('MESSAGE').value,
            is_active: document.getElementById('IS_ACTIVE').value
        };
        if (isEdit) thresholdInfo.id = document.getElementById('THRESHOLD_ID').value;

        const url = isEdit ? '/api/modifyThreshold' : '/api/addThreshold';

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(thresholdInfo)
            });

            if (response.ok) {
                showToast(isEdit ? '임계치 수정 완료.' : '임계치 추가 완료.');
                closeModal('threshold-modal-overlay');
                fetchThresholds();
            } else {
                showToast(`요청 실패: ${response.status}`, 'error');
            }
        } catch (error) {
            console.error('Error:', error.message);
            showToast('요청 처리 중 오류가 발생했습니다.', 'error');
        }
    }

    async function deleteThreshold(event, thresholdId, listItem) {
        try {
            const response = await fetch('/api/deleteThreshold', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ thresholdId })
            });

            if (response.ok) {
                showToast('임계치 삭제 완료.');
                listItem.remove();
            } else {
                showToast(`요청 실패: ${response.status}`, 'error');
            }
        } catch (error) {
            console.error('Error:', error.message);
            showToast('요청 처리 중 오류가 발생했습니다.', 'error');
        }
    }

    async function init() {
        const user = await getCurrentUser();
        canManage = isDbaOrAbove(user);
        document.getElementById('add-threshold-btn').style.display = canManage ? '' : 'none';
        showFlashMessageIfAny();
        fetchThresholds();
        setupModalDismiss('threshold-modal-overlay');
    }
    init();
</script>
</body>
</html>

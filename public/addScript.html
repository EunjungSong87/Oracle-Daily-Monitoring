<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="common.js"></script>
    <title>Add Script</title>
</head>
<body>

<a href="monitoringScript.html">
<h1>Add Script</h1>
</a>

<nav>
    <ul>
        <li><a href="index.html">DBMS List</a></li>
        <li><a href="dailyMonitoring.html">Daily Monitoring</a></li>
        <li><a href="monitoringScript.html">Monitoring Scripts</a></li>
        <li><a href="monitoringThresholds.html">Thresholds</a></li>
        <li><a href="tableSpec.html">Table Spec</a></li>
        <li><a href="history.html">Run History</a></li>
        <li><a href="issues.html">Issues</a></li>
    </ul>
</nav>

<!-- Script 추가 폼입니다. -->
<form id="add-script" onsubmit="addScript(event)">
    <label for="ID">ID:</label>
    <input type="number" id="ID" name="ID" required><br>

    <label for="NAME">NAME:</label>
    <input type="text" id="NAME" name="NAME" required><br>

    <label for="CATEGORY">CATEGORY:</label>
    <input type="text" id="CATEGORY" name="CATEGORY" required><br>

    <label for="DESCRIPTION">DESCRIPTION:</label>
    <input type="text" id="DESCRIPTION" name="DESCRIPTION" required><br>

    <label for="SID">SQL_TEXT:</label>
    <textarea type="text" id="SQL_TEXT" name="SQL_TEXT" required></textarea><br>

    <label for="SCHEDULE">SCHEDULE:</label>
    <input type="text" id="SCHEDULE" name="SCHEDULE" required><br>

    <label for="IS_ACTIVE">IS_ACTIVE:</label>
    <input type="text" id="IS_ACTIVE" name="IS_ACTIVE" required><br>

    <!-- 게시글 작성 버튼 -->
    <button type="submit">Sript 추가</button>

    <!-- 뒤로가기 버튼 -->
    <button type="button" class="btn-secondary" onclick="goBack()">뒤로 가기</button>
</form>

<!-- 게시글 작성 스크립트 파일을 로드합니다. -->
<script>
    async function addScript(evnet) {
        event.preventDefault();
        const id   =  document.getElementById('ID');
        const name =  document.getElementById('NAME');
        const category =  document.getElementById('CATEGORY');
        const description    =    document.getElementById('DESCRIPTION');
        const sql_text     =    document.getElementById('SQL_TEXT');
        const schedule   =    document.getElementById('SCHEDULE');
        const is_active   =    document.getElementById('IS_ACTIVE');


        if (!id.value || !name.value || !category.value || !schedule.value || !sql_text.value || !is_active.value) {
            showToast('필수 항목을 입력해주세요.', 'error');
            return;
        }

        const scriptInfo = {
            id: id.value,
            name: name.value,
            category: category.value,
            description: description.value,
            sql_text: sql_text.value,
            schedule: schedule.value,
            is_active: is_active.value
        };

        try {
            const response = await fetch('/api/addScript', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(scriptInfo)
            });

            if (response.ok) {
                setFlashMessage('Script 추가 완료.');
                window.location.href = 'monitoringScript.html'
            } else {
                showToast(`요청 실패: ${response.status}`, 'error');
            }
        } catch (error) {
            console.error('Error:', error.message);
            showToast('요청 처리 중 오류가 발생했습니다.', 'error');
        }
    }

    function goBack() {
        window.history.back();
    }
</script>
</body>
</html>
